name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"

      - name: Validate LiveKit dependencies and lockfile
        run: |
          python scripts/check_livekit_agents_dependency.py
          uv lock --check

      - name: Validate package versions
        shell: bash
        run: |
          set -euo pipefail

          release_version="${GITHUB_REF_NAME#v}"
          if [[ -z "${release_version}" || "${release_version}" == "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Release tag must use the v<version> format."
            exit 1
          fi

          for version_file in livekit-plugins/*/livekit/plugins/*/version.py; do
            package_version="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' "${version_file}")"
            if [[ "${package_version}" != "${release_version}" ]]; then
              echo "::error file=${version_file}::Package version ${package_version:-<missing>} does not match tag ${GITHUB_REF_NAME}."
              exit 1
            fi
          done

      - name: Build plugin packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          for package_dir in livekit-plugins/*; do
            if [[ -f "${package_dir}/pyproject.toml" ]]; then
              (
                cd "${package_dir}"
                uv build --out-dir "${GITHUB_WORKSPACE}/dist"
              )
            fi
          done

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          print-hash: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
