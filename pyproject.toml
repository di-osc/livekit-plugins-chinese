[project]
name = "livekit-plugins-chinese"
version = "0.1.0"
requires-python = ">=3.10"

[tool.uv]
constraint-dependencies = [
    "livekit-agents==1.8.13",
]

[tool.uv.sources]
livekit-agents = { index = "pypi" }
livekit-plugins-volcengine = { workspace = true }
livekit-plugins-dify = { workspace = true}
livekit-plugins-flashtts = { workspace = true}
livekit-plugins-aliyun = { workspace = true}

[tool.uv.workspace]
members = ["livekit-plugins/*"]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio>=0.25.3",
]
dev = [
    { include-group = "test" },
    "python-dotenv>=1.0.1",
    "ruff",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
